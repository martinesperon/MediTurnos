{% extends 'base.html' %}

{% block title %}Eliminar especialidad{% endblock %}

{% block content %}
<h2>¿Eliminar "{{ specialty.name }}"?</h2>
<p>Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Sí, eliminar</button>
    <a class="btn" href="{% url 'specialty_list' %}">Cancelar</a>
</form>
{% endblock %}
