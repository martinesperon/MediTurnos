{% extends 'base.html' %}

{% block title %}{% if object %}Editar{% else %}Nuevo{% endif %} médico{% endblock %}

{% block content %}
<h2>{% if object %}Editar{% else %}Nuevo{% endif %} médico</h2>
<div class="form-card">
    <form method="post" class="js-validate">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Guardar</button>
    </form>
</div>
{% endblock %}
